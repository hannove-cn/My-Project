<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sorting Hat | Hogwarts</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Georgia, serif;
    }

    body {
        background: #0b0f1a;
        color: #f0e6d2;
        padding: 40px 20px;
        min-height: 100vh;
    }

    nav {
        text-align: center;
        margin-bottom: 40px;
    }

    nav a {
        color: #d4af37;
        text-decoration: none;
        margin: 0 12px;
        font-size: 17px;
    }

    nav a:hover {
        text-shadow: 0 0 8px #d4af37;
    }

    h1 {
        color: #d4af37;
        text-align: center;
        margin-bottom: 12px;
        font-size: 38px;
        letter-spacing: 1px;
    }

    .subtitle {
        text-align: center;
        color: #b8a984;
        margin-bottom: 40px;
        font-size: 16px;
    }

    .hat-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
    }

    /* 帽子容器 */
    .hat-container {
        position: relative;
        width: 300px;
        height: 340px;
        cursor: pointer;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        transition: transform 0.2s ease;
    }

    .hat-container:hover {
        transform: scale(1.03);
    }

    /* 常态轻微晃动 */
    @keyframes idleSway {
        0%, 100% { transform: rotate(-2deg); }
        50% { transform: rotate(2deg); }
    }

    /* 点击抖动 */
    @keyframes clickShake {
        0%, 100% { transform: translateX(0) rotate(0); }
        20% { transform: translateX(-8px) rotate(-4deg); }
        40% { transform: translateX(8px) rotate(4deg); }
        60% { transform: translateX(-6px) rotate(-3deg); }
        80% { transform: translateX(6px) rotate(3deg); }
    }

    .hat-idle {
        animation: idleSway 2.6s ease-in-out infinite;
        transform-origin: bottom center;
    }

    .hat-shake {
        animation: clickShake 0.6s ease-in-out;
        transform-origin: bottom center;
    }

    /* 朴素巫师帽：2D插画，无表情 */
    .wizard-hat {
        position: relative;
        width: 240px;
        height: 300px;
    }

    /* 帽身 */
    .hat-cone {
        position: absolute;
        bottom: 70px;
        left: 50%;
        transform: translateX(-50%);
        width: 140px;
        height: 220px;
        background: linear-gradient(180deg,
            #5a3a1e 0%,
            #6b4423 25%,
            #7a4f2a 55%,
            #6b4423 80%,
            #5a3a1e 100%);
        border-radius: 50% 50% 30% 30% / 70% 70% 30% 30%;
        box-shadow:
            inset -12px -14px 30px rgba(0, 0, 0, 0.5),
            inset 10px 8px 24px rgba(255, 210, 150, 0.12),
            0 8px 20px rgba(0, 0, 0, 0.45);
    }

    /* 帽子尖顶 */
    .hat-tip {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 70px;
        height: 90px;
        background: linear-gradient(180deg, #4a2f18 0%, #5a3a1e 100%);
        border-radius: 50% 50% 20% 20% / 60% 60% 20% 20%;
        box-shadow:
            inset -6px -8px 16px rgba(0, 0, 0, 0.5),
            0 4px 10px rgba(0, 0, 0, 0.4);
    }

    /* 帽檐 */
    .hat-brim {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 60px;
    background: linear-gradient(180deg, #7a4f2a 0%, #5a3a1e 100%);
    border-radius: 50%;
    box-shadow:
        inset 0 8px 14px rgba(0, 0, 0, 0.5),
        0 10px 24px rgba(0, 0, 0, 0.45);
}


    /* 星星装饰 */
    .star {
        position: absolute;
        color: #ffd95a;
        font-size: 18px;
        text-shadow: 0 0 8px rgba(255, 217, 90, 0.8);
        animation: twinkle 1.4s ease-in-out infinite;
    }

    .star.s1 { top: 40px; left: 20px; animation-delay: 0s; }
    .star.s2 { top: 80px; right: 10px; animation-delay: 0.3s; }
    .star.s3 { top: 150px; left: 10px; animation-delay: 0.6s; }
    .star.s4 { top: 210px; right: 30px; animation-delay: 0.9s; }
    .star.s5 { top: 260px; left: 40px; animation-delay: 0.2s; }

    @keyframes twinkle {
        0%, 100% { opacity: 0.3; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.15); }
    }

    /* 对话框 */
    .speech-bubble {
        max-width: 520px;
        min-height: 90px;
        padding: 24px 28px;
        background: linear-gradient(180deg, #141a2b 0%, #0f1422 100%);
        border: 2px solid #d4af37;
        border-radius: 18px;
        box-shadow:
            0 0 22px rgba(212, 175, 55, 0.35),
            inset 0 0 18px rgba(212, 175, 55, 0.08);
        text-align: center;
        position: relative;
    }

    .speech-bubble::before {
        content: "";
        position: absolute;
        top: -14px;
        left: 50%;
        transform: translateX(-50%);
        border-left: 14px solid transparent;
        border-right: 14px solid transparent;
        border-bottom: 14px solid #d4af37;
    }

    .speech-bubble p {
        font-size: 20px;
        line-height: 1.6;
        color: #f5e9c8;
        letter-spacing: 0.5px;
    }

    .house-name {
        color: #d4af37;
        font-size: 28px;
        font-weight: bold;
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
    }

    .tip {
        text-align: center;
        color: #8f846b;
        font-size: 14px;
        margin-top: 10px;
    }
</style>
</head>

<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="project.html">Facilities</a>
        <a href="quote.html">Characters</a>
        <a href="useless-machine.html">Useless Machine</a>
        <a href="sorting-hat.html">Sorting Hat</a>
    </nav>

    <h1>The Sorting Hat</h1>
    <p class="subtitle">Click the hat to find out which house belongs to you.</p>

    <div class="hat-section">
        <div class="hat-container hat-idle" id="hatContainer">
            <div class="wizard-hat">
                <div class="hat-tip"></div>
                <div class="hat-cone"></div>
                <div class="hat-brim"></div>

                <!-- 闪烁星星 -->
                <span class="star s1">✦</span>
                <span class="star s2">✦</span>
                <span class="star s3">✦</span>
                <span class="star s4">✦</span>
                <span class="star s5">✦</span>
            </div>
        </div>

        <div class="speech-bubble">
            <p id="hatMessage">I am the Hogwarts Sorting Hat. Click me, and I will decide your house.</p>
        </div>

        <p class="tip">Click count: <span id="clickCount">0</span></p>
    </div>

    <script>
        const hatContainer = document.getElementById('hatContainer');
        const hatMessage = document.getElementById('hatMessage');
        const clickCountEl = document.getElementById('clickCount');

        const houses = [
            "Gryffindor",
            "Hufflepuff",
            "Ravenclaw",
            "Slytherin"
        ];

        const houseDescriptions = {
            Gryffindor: "Courage, bravery, and determination belong to Gryffindor.",
            Hufflepuff: "Loyalty, patience, and hard work belong to Hufflepuff.",
            Ravenclaw: "Wisdom, creativity, and a love of learning belong to Ravenclaw.",
            Slytherin: "Ambition, cunning, and resourcefulness belong to Slytherin."
        };

        let clickCount = 0;
        let sorted = false;
        let isAnimating = false;

        hatContainer.addEventListener('click', () => {
            if (isAnimating) return;

            clickCount++;
            clickCountEl.textContent = clickCount;

            hatContainer.classList.remove('hat-idle');
            hatContainer.classList.add('hat-shake');
            isAnimating = true;

            setTimeout(() => {
                hatContainer.classList.remove('hat-shake');
                hatContainer.classList.add('hat-idle');
                isAnimating = false;
            }, 600);

            if (clickCount === 1 && !sorted) {
                const randomHouse = houses[Math.floor(Math.random() * houses.length)];
                hatMessage.innerHTML =
                    "Hmm... I think I see it clearly now.<br>" +
                    "You belong to <span class='house-name'>" + randomHouse + "</span>.<br>" +
                    "<span style='font-size:17px;color:#d4c89a'>" + houseDescriptions[randomHouse] + "</span>";
                sorted = true;
            } else if (clickCount >= 10) {
                hatMessage.textContent = "Stop hitting this poor hat!";
            } else if (sorted) {
                hatMessage.textContent = "You have already been sorted.";
            } else {
                hatMessage.textContent = "The hat is thinking... Try again.";
            }
        });
    </script>
</body>
</html>
